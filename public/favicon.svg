<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" shape-rendering="crispEdges">
  <rect width="32" height="32" rx="4" fill="#3b5bdb"/>
  <!-- pixel sunglasses: 2px grid -->
  <g fill="#0b1021">
    <!-- brow bar (connects both lenses) -->
    <rect x="2" y="12" width="28" height="2"/>
    <!-- left lens -->
    <rect x="2" y="14" width="12" height="6"/>
    <!-- right lens -->
    <rect x="18" y="14" width="12" height="6"/>
  </g>
  <!-- pixel glints -->
  <g fill="#ffffff">
    <rect x="4" y="15" width="2" height="2"/>
    <rect x="20" y="15" width="2" height="2"/>
  </g>
</svg>
